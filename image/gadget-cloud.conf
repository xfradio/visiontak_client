#cloud-config
#
# Shipped as cloud.conf in the gadget snap root. snapd installs it during install mode
# as /etc/cloud/cloud.cfg.d/80_device_gadget.cfg, and grade: dangerous takes it
# unfiltered (sysconfig/cloudinit.go: "for grade dangerous we just install all the
# config").
#
# It does two things that cannot be done from the image otherwise.
#
# It connects visiontak-client:hdmi-cec to pi:hdmi-cec. The gadget.yaml `connections:`
# stanza cannot — snapd skips gadget connections outright for a snap with no snap-id,
# which is every snap in a locally built image. See docs/ubuntu-core-image.md.
#
# And it clears the console VT, which is what a television actually shows during boot.
# See docs/boot-splash.md.
#
# The datasource block is the part that makes this run at all. A previous attempt
# shipped cloud.conf with the config alone and it never executed: with no datasource
# to find, cloud-init reports itself untriggered and snapd then writes
# /etc/cloud/cloud-init.disabled, before any module has run. `None` is the documented
# fallback datasource for exactly this — on-disk config with nothing to fetch — and
# `userdata_raw` is where it takes cloud-config from. NoCloud stays ahead of it so a
# real seed (a USB stick during bring-up) still wins.
datasource_list: [NoCloud, None]
datasource:
  None:
    metadata:
      instance-id: visiontak-client-firstboot
    userdata_raw: |
      #cloud-config
      runcmd:
        # cloud-final is not ordered against snapd's seeding, and the client snap does
        # not exist as far as `snap connect` is concerned until seeding has finished.
        - [snap, wait, system, seed.loaded]
        - [snap, connect, visiontak-client:hdmi-cec, pi:hdmi-cec]

        # Until Ubuntu Frame starts and switches the display to its own VT (tty4), the
        # television is showing a text VT, and both candidates have something on them:
        # console-conf@tty3 on the console VT, getty@tty1 on VT1. Which of the two is
        # in front depends on whether the kernel follows console=tty3 with the display,
        # which is a kmsg_redirect detail not worth resting a wall display on. Clear
        # both instead.
        #
        # `console-conf: disable: true` in the gadget defaults does not do this.
        # Disabling console-conf skips the setup wizard and leaves a login prompt on the
        # console VT — observed on a device whose defaults were applied correctly, as
        # console-conf@tty3.service, active, running.
        #
        # The gettys on those VTs go with them, or systemd starts one in console-conf's
        # place. The keyboard login is not given up, only moved: it lives on tty2, which
        # nothing displays. Alt-F2 on a unit with no network.
        - [systemctl, enable, --now, getty@tty2.service]
        - [systemctl, mask, --now, console-conf@tty1.service, console-conf@tty3.service]
        - [systemctl, mask, --now, getty@tty1.service, getty@tty3.service]
