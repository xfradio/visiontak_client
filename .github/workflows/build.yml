name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Building on every branch push and again on the PR would run the same commit twice;
# superseding in-flight runs for a ref keeps that from queueing up behind itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests + lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No GTK, CEC hardware or server needed — see the README.
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: ruff check src tests

  snap:
    name: snap (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 must build on an arm64 runner. Cross-building is not possible for
          # this project: the gnome extension needs mesa-2404 and gnome-46-2404-sdk
          # as build-snaps matching the *target* arch, and snapd cannot install arm64
          # snaps into an amd64 container. See docs/arm64-build.md.
          - platform: arm64
            runner: ubuntu-24.04-arm
          - platform: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Warn if the logo is missing
        run: |
          if [ ! -f assets/visiontak-logo.png ]; then
            echo "::warning::assets/visiontak-logo.png absent — the snap will ship a text splash"
          fi

      - uses: snapcore/action-build@v1
        id: build
        with:
          snapcraft-args: pack --build-for=${{ matrix.platform }}

      # The build can succeed while shipping no artwork, which is only visible on a
      # display. Assert it landed rather than finding out on the Pi.
      - name: Verify the logo was staged
        if: hashFiles('assets/visiontak-logo.png') != ''
        run: |
          unsquashfs -q -f -d /tmp/snapcheck "${{ steps.build.outputs.snap }}" assets
          test -f /tmp/snapcheck/assets/visiontak-logo.png \
            || { echo "::error::logo missing from the built snap"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: visiontak-client-${{ matrix.platform }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  image:
    name: SD card image
    needs: snap
    # Model assertions are always signed, so this cannot run without the brand key.
    # Skipped rather than failed when the secrets are absent, so forks and PRs from
    # contributors without the key still get a green build.
    if: vars.BRAND_ID != '' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: visiontak-client-arm64
          path: dist

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick xz-utils
          sudo snap install snapcraft --classic
          sudo snap install ubuntu-image --classic

      - name: Import the model signing key
        env:
          MODEL_SIGN_KEY: ${{ secrets.MODEL_SIGN_KEY }}
          MODEL_SIGN_PASSPHRASE: ${{ secrets.MODEL_SIGN_PASSPHRASE }}
          MODEL_KEY: ${{ vars.MODEL_KEY }}
        run: |
          set -eu
          test -n "$MODEL_SIGN_KEY" || { echo "::error::MODEL_SIGN_KEY secret is empty"; exit 1; }
          export GNUPGHOME="$HOME/.snap/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"

          # GnuPG puts the gpg-agent socket under /run/user/$UID when that path exists.
          # A hosted runner has no systemd user session, so it does not — and every
          # signature then fails with the singularly unhelpful
          # "gpg: signing failed: No such file or directory".
          sudo mkdir -p "/run/user/$(id -u)"
          sudo chown "$(id -u):$(id -g)" "/run/user/$(id -u)"
          chmod 700 "/run/user/$(id -u)"

          # `snap sign` shells out to gpg with no passphrase arguments, so a protected
          # key can only work if gpg-agent already holds the secret. Preset it rather
          # than using loopback pinentry, which needs input gpg cannot ask for under
          # --batch ("Sorry, we are in batchmode - can't get input").
          {
            echo 'allow-preset-passphrase'
            echo 'allow-loopback-pinentry'
            echo 'default-cache-ttl 7200'
            echo 'max-cache-ttl 7200'
          } >> "$GNUPGHOME/gpg-agent.conf"

          printf '%s' "$MODEL_SIGN_KEY" | gpg --batch --import
          gpgconf --launch gpg-agent
          gpgconf --reload gpg-agent
          gpg --batch --list-secret-keys

          if [ -n "${MODEL_SIGN_PASSPHRASE:-}" ]; then
            KEYGRIP=$(gpg --batch --with-colons --with-keygrip \
              --list-secret-keys "$MODEL_KEY" | awk -F: '/^grp:/ {print $10; exit}')
            test -n "$KEYGRIP" || { echo "::error::could not read the keygrip for '$MODEL_KEY'"; exit 1; }
            printf '%s' "$MODEL_SIGN_PASSPHRASE" \
              | /usr/lib/gnupg/gpg-preset-passphrase --preset "$KEYGRIP"
            echo "passphrase preset into gpg-agent"
          fi

          # Prove the key can actually sign before spending ten minutes building a
          # gadget we would only throw away.
          echo probe | gpg --batch --yes --local-user "$MODEL_KEY" --detach-sign -o /dev/null \
            || { echo "::error::imported key cannot sign — does MODEL_KEY ('$MODEL_KEY') match the key UID above?"; exit 1; }
          echo "signing works"

      - name: Build the image
        shell: bash
        env:
          BRAND_ID: ${{ vars.BRAND_ID }}
          MODEL_KEY: ${{ vars.MODEL_KEY }}
        # -x so a failure names the command that failed; the job log is the only
        # diagnostic available for a build that cannot be reproduced off arm64.
        run: |
          set -o pipefail
          sh -x image/build-image.sh dist/visiontak-client_*_arm64.snap 2>&1 | tee /tmp/build.log

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "--- model ---";        cat image/work/model.json 2>/dev/null || true
          echo "--- signing keys ---"; GNUPGHOME=~/.snap/gnupg gpg --batch --list-secret-keys 2>&1 || true
          echo "--- snap keys ---";    snap keys 2>&1 || true
          echo "--- gadget tree ---";  ls -la image/work/pi-gadget 2>/dev/null || true
          echo "--- disk ---";         df -h / | tail -1
          # Re-emit the tail as annotations. Workflow logs need an authenticated
          # token to download, but annotations are readable from the public API —
          # so this is what makes a failure diagnosable without hand-copying it.
          # One annotation carrying the whole tail: GitHub only surfaces a handful of
          # per-line annotations, which silently dropped the actual error last time.
          if [ -f /tmp/build.log ]; then
            ENC=$(tail -n 60 /tmp/build.log \
              | sed -z 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=build tail::${ENC}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: visiontak-pi-sdcard-image
          path: image/out/*.img.xz
          if-no-files-found: error

  release:
    name: release
    needs: snap
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.snap
          generate_release_notes: true
