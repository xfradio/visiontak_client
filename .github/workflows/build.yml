name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests + lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No GTK, CEC hardware or server needed — see the README.
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: ruff check src tests

  snap:
    name: snap (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 must build on an arm64 runner. Cross-building is not possible for
          # this project: the gnome extension needs mesa-2404 and gnome-46-2404-sdk
          # as build-snaps matching the *target* arch, and snapd cannot install arm64
          # snaps into an amd64 container. See docs/arm64-build.md.
          - platform: arm64
            runner: ubuntu-24.04-arm
          - platform: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Warn if the logo is missing
        run: |
          if [ ! -f assets/visiontak-logo.png ]; then
            echo "::warning::assets/visiontak-logo.png absent — the snap will ship a text splash"
          fi

      - uses: snapcore/action-build@v1
        id: build
        with:
          snapcraft-args: pack --build-for=${{ matrix.platform }}

      # The build can succeed while shipping no artwork, which is only visible on a
      # display. Assert it landed rather than finding out on the Pi.
      - name: Verify the logo was staged
        if: hashFiles('assets/visiontak-logo.png') != ''
        run: |
          unsquashfs -q -f -d /tmp/snapcheck "${{ steps.build.outputs.snap }}" assets
          test -f /tmp/snapcheck/assets/visiontak-logo.png \
            || { echo "::error::logo missing from the built snap"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: visiontak-client-${{ matrix.platform }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  release:
    name: release
    needs: snap
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.snap
          generate_release_notes: true
